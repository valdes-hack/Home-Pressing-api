spring:
  application:
    name: atlantic-palace-pressing-api

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/atlantic_palace_pressing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Douala&characterEncoding=UTF-8}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  security:
    jwt-secret: ${JWT_SECRET:AtlanticPalacePressingSecretKeyv30YaoundeCamerounIUGEEKeyce2026SecureKey}
    jwt-expiration-ms: 28800000 # 8 heures (journée de caisse / verrouillage session BNF10)
  sms:
    enabled: ${SMS_ENABLED:false}
    provider-url: ${SMS_PROVIDER_URL:https://api.sms-gateway.example/send}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
